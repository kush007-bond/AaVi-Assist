<!DOCTYPE html>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="bg-white dark:bg-slate-900 docked full-width top-0 border-b border-b-2 border-slate-200 dark:border-slate-800 flat no shadows flex justify-between items-center w-full px-6 h-16 sticky z-50">
<button aria-label="Menu" class="flex items-center justify-center min-w-[44px] min-h-[44px] text-blue-700 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-slate-800 active:scale-95 transition-all duration-200 rounded-full focus:outline-none focus:ring-3 focus:ring-primary-fixed-dim">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">visibility</span>
</button>
<h1 class="font-['Public_Sans'] font-bold tracking-tight text-lg text-xl font-black text-blue-700 dark:text-blue-400">VisionAid</h1>
<button aria-label="Emergency Home" class="flex items-center justify-center min-w-[44px] min-h-[44px] text-blue-700 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-slate-800 active:scale-95 transition-all duration-200 rounded-full focus:outline-none focus:ring-3 focus:ring-primary-fixed-dim">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">emergency_home</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col w-full max-w-[800px] mx-auto overflow-hidden bg-surface-container-lowest">
<!-- Camera View Area -->
<section class="relative w-full aspect-[4/3] bg-black overflow-hidden shadow-sm">
<img alt="Camera view of surroundings" class="w-full h-full object-cover opacity-80" data-alt="A first-person point of view of a modern, well-lit indoor environment, possibly a hallway or office space, seen through a digital camera interface. The lighting is bright and even, highlighting a clear path forward. The scene embodies a clean, functional aesthetic with high contrast elements, suitable for a navigation assistance application. The mood is clear and unhindered." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCj0a-L6viZhR-Pbn_PM_fKdL6pDruJZiyasb5pPAldFYn2DPUZq4VgPAR7cxKxNhPOq7y9AixgZmmp1z9_KgQral7pSYp5YMvI3qaDolnjdDeS7Q3oRP6MWfDU4hJBVcK9SQeZbqdZjiffpn-w-wGSl0ioUEzMBUPyQiKL34uNHhGWpiDA1uL3gxMqrcHJDyBlAqBMPcMbbBtwS5Zs4Fs7ERZ8AgAoSd93YWdQoYofxtFA8RUQ3gjl0X53kpOXLChs4aFR-HQrYM8K"/>
<!-- Camera UI Overlays -->
<div class="absolute top-4 right-4 flex gap-2">
<div class="bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full flex items-center gap-2 border border-white/20">
<div class="w-2 h-2 rounded-full bg-error animate-pulse"></div>
<span class="text-white font-label-bold text-label-bold text-sm">LIVE</span>
</div>
</div>
<!-- Mini-map Overlay -->
<div class="absolute bottom-4 left-4 w-32 h-32 bg-surface-container-lowest rounded-xl border-2 border-primary-container overflow-hidden shadow-[0_4px_12px_rgba(0,0,0,0.3)]">
<div class="w-full h-full bg-surface-container-low flex items-center justify-center" data-location="Office Floor Plan" style="">
<span class="material-symbols-outlined text-primary-container text-4xl" style="font-variation-settings: 'FILL' 0;">map</span>
</div>
<div class="absolute inset-0 border-2 border-primary-container rounded-xl pointer-events-none"></div>
</div>
<!-- Mic FAB Overlay -->
<button aria-label="Voice Command" class="absolute bottom-4 right-4 w-16 h-16 bg-primary-container rounded-full flex items-center justify-center text-on-primary shadow-[0_8px_16px_rgba(0,0,0,0.4)] hover:bg-tertiary-container focus:ring-4 focus:ring-primary-fixed transition-all active:scale-95">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</section>
<!-- Sensor & Status Area -->
<section class="flex flex-col gap-unit p-gutter bg-surface-container-lowest z-10 -mt-2 rounded-t-xl shadow-[0_-4px_16px_rgba(0,0,0,0.1)]">
<!-- Distance Sensor Bar -->
<div class="flex items-center justify-between bg-surface-container-low p-3 rounded-lg border border-outline-variant">
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">radar</span>
<span class="font-label-bold text-label-bold text-sm">Clear Path</span>
</div>
<div class="font-h3 text-h3 text-primary-container">
                    &gt; 5m
                </div>
</div>
<!-- Voice Strip -->
<div class="flex items-center gap-3 p-4 bg-primary-fixed rounded-lg border border-primary-fixed-dim">
<div class="flex gap-1 items-center h-6">
<div class="w-1.5 h-3 bg-primary-container rounded-full animate-bounce" style="animation-delay: 0ms;"></div>
<div class="w-1.5 h-5 bg-primary-container rounded-full animate-bounce" style="animation-delay: 150ms;"></div>
<div class="w-1.5 h-4 bg-primary-container rounded-full animate-bounce" style="animation-delay: 300ms;"></div>
<div class="w-1.5 h-6 bg-primary-container rounded-full animate-bounce" style="animation-delay: 450ms;"></div>
<div class="w-1.5 h-3 bg-primary-container rounded-full animate-bounce" style="animation-delay: 600ms;"></div>
</div>
<p class="font-body-md text-body-md text-on-primary-fixed flex-1">Listening for command...</p>
</div>
<!-- Action Bar -->
<div class="flex gap-gutter items-center mt-2">
<!-- Environment Toggle -->
<div class="flex bg-surface-container-high rounded-full p-1 border border-outline-variant flex-1 max-w-[200px]">
<button aria-pressed="true" class="flex-1 py-2 px-4 rounded-full bg-surface-container-lowest shadow-sm font-label-bold text-label-bold text-sm text-primary-container focus:outline-none focus:ring-2 focus:ring-primary-container">
                        Indoor
                    </button>
<button aria-pressed="false" class="flex-1 py-2 px-4 rounded-full font-label-bold text-label-bold text-sm text-on-surface-variant hover:bg-surface-container focus:outline-none focus:ring-2 focus:ring-primary-container">
                        Outdoor
                    </button>
</div>
<!-- Start Button -->
<button class="flex-1 h-14 bg-primary-container text-on-primary font-h3 text-[20px] rounded-lg shadow-[0_4px_8px_rgba(21,101,192,0.3)] hover:bg-tertiary-container focus:ring-4 focus:ring-primary-fixed transition-all active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                    START NAV
                </button>
</div>
<!-- Description Banner -->
<div class="mt-2 p-4 bg-surface-container rounded-lg border border-outline-variant flex gap-4 items-start">
<span class="material-symbols-outlined text-primary-container mt-1" style="font-variation-settings: 'FILL' 0;">visibility</span>
<p class="font-body-lg text-body-lg text-on-surface leading-tight">
                    "You are in a well-lit hallway. The path ahead is clear for at least 5 meters. There are doors on your right."
                </p>
</div>
</section>
<!-- Bottom Chat Input (Web only, mobile uses Bottom Nav) -->
<section class="hidden md:flex mt-auto p-gutter bg-surface-container-lowest border-t border-outline-variant">
<div class="relative w-full">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant">chat</span>
<input class="w-full h-14 pl-12 pr-14 rounded-lg bg-surface-container-low border border-outline-variant focus:border-primary-container focus:ring-2 focus:ring-primary-fixed font-body-md text-body-md text-on-surface placeholder-on-surface-variant" placeholder="Ask about your surroundings..." type="text"/>
<button class="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center text-primary-container hover:bg-surface-container rounded-full focus:ring-2 focus:ring-primary-fixed">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden bg-white dark:bg-slate-900 docked full-width bottom-0 border-t rounded-t-lg border-t-2 border-slate-200 dark:border-slate-800 shadow-[0_-4px_10px_0_rgba(0,0,0,0.05)] fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 h-24">
<a class="flex flex-col items-center justify-center bg-blue-700 dark:bg-blue-600 text-white rounded-lg px-4 py-2 ring-4 ring-blue-100 dark:ring-blue-900/30 font-['Public_Sans'] font-bold text-[12px] uppercase tracking-wider active:scale-90 transition-transform duration-150 min-w-[44px] min-h-[44px]" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">home</span>
            Home
        </a>
<a class="flex flex-col items-center justify-center text-slate-600 dark:text-slate-400 px-4 py-2 hover:text-blue-800 dark:hover:text-blue-200 font-['Public_Sans'] font-bold text-[12px] uppercase tracking-wider active:scale-90 transition-transform duration-150 min-w-[44px] min-h-[44px]" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">explore</span>
            Navigate
        </a>
<a class="flex flex-col items-center justify-center text-slate-600 dark:text-slate-400 px-4 py-2 hover:text-blue-800 dark:hover:text-blue-200 font-['Public_Sans'] font-bold text-[12px] uppercase tracking-wider active:scale-90 transition-transform duration-150 min-w-[44px] min-h-[44px]" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">layers</span>
            Room Map
        </a>
<a class="flex flex-col items-center justify-center text-slate-600 dark:text-slate-400 px-4 py-2 hover:text-blue-800 dark:hover:text-blue-200 font-['Public_Sans'] font-bold text-[12px] uppercase tracking-wider active:scale-90 transition-transform duration-150 min-w-[44px] min-h-[44px]" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">settings</span>
            Settings
        </a>
</nav>
</body></html>
